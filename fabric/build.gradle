apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    implementation "com.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    common(project(path: ":common")) { transitive false }

    // Optional: -Pcatgirl_jar=<path to a Catgirl & Catboy Mod Fabric jar> puts that mod into the dev runs and client
    // tests, to check the ear warmers on its cat ears (compat.catgirl). It isn't published yet, so there's no coordinate.
    if (project.hasProperty("catgirl_jar")) {
        runtimeOnly files(project.property("catgirl_jar"))
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

// Server GameTests: shared bodies in common/.../gametest, Fabric glue in src/gametest. They run as part of `build`
// via the generated `runGameTest` task (Fabric skips the EULA check for test servers).
// Client GameTests (src/gametest): screenshots of the cosmetics in a real client window. Not part of `build`;
// run manually: ./gradlew :fabric:runClientGameTest (screenshots in build/run/clientGameTest/screenshots)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "cozychristmas-test"
        enableGameTests = true
        enableClientGameTests = true
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-fabric"
    exclude "architectury.common.json"
    exclude "dev/eliasnvx/cozychristmas/gametest/**" // shared GameTest bodies stay out of the released jar
    from rootProject.file("LICENSE")
}

assemble.dependsOn shadowJar
