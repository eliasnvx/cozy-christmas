apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }

    // Compat checks in the dev runs and GameTests: -Pcompat=true loads JEI, REI, Jade, Serene Seasons and Snowy Spirit, or
    // some of them: -Pcompat=jei,jade,seasons,snowy (JEI and REI both draw an item list)
    def compat = project.findProperty("compat")?.toString()
    if (compat != null) {
        def wanted = { String group -> compat == "true" || compat.split(",")*.trim().contains(group) }
        if (wanted("jei")) {
            modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}") { transitive false }
            modRuntimeOnly("net.mezzdev.config:mezz_config-${rootProject.minecraft_version}-fabric:${rootProject.mezz_config_version}") { transitive false }
        }
        if (wanted("rei")) {
            modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rootProject.rei_version}") { transitive false }
            modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") { transitive false }
            modRuntimeOnly("me.shedaniel.cloth:basic-math:${rootProject.basic_math_version}") { transitive false }
        }
        if (wanted("jade")) {
            modRuntimeOnly("maven.modrinth:jade:${rootProject.jade_fabric_version}") { transitive false }
        }
        if (wanted("seasons")) {
            modRuntimeOnly("maven.modrinth:serene-seasons:${rootProject.serene_seasons_fabric_id}") { transitive false }
            modRuntimeOnly("maven.modrinth:glitchcore:${rootProject.glitchcore_fabric_id}") { transitive false }
        }
        if (wanted("snowy")) {
            modRuntimeOnly("maven.modrinth:snowy-spirit:${rootProject.snowy_spirit_fabric_id}") { transitive false }
            modRuntimeOnly("maven.modrinth:moonlight:${rootProject.moonlight_fabric_id}") { transitive false }
            // Moonlight nests codecui in its jar, which a real install unpacks and the dev runtime doesn't
            def moonlight = configurations.detachedConfiguration(
                    dependencies.create("maven.modrinth:moonlight:${rootProject.moonlight_fabric_id}"))
            moonlight.transitive = false
            def nested = layout.buildDirectory.dir("nested/moonlight").get().asFile
            copy {
                from(zipTree(moonlight.singleFile)) { include "META-INF/jars/*.jar" }
                into nested
                eachFile { path = name }
                includeEmptyDirs = false
            }
            modRuntimeOnly fileTree(nested) { include "*.jar" }
        }
    }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

// Server GameTests: shared bodies in common/.../gametest (the cosmetic slot dupe checks), Fabric glue in src/gametest.
// They run as part of `build` via the generated `runGameTest` task.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "cozychristmas-test"
        enableGameTests = true
        enableClientGameTests = false // 1.21.1 Fabric API has no client GameTest API
    }
}

// Dev-only check in a real client (1.21.1 has no client GameTest API): the shared DevCheck, started from src/gametest.
// Opens build/run/devCheck/saves/cozychristmas-check (created flat on the first run), dresses the player, places blocks and
// mobs, takes screenshots into build/run/devCheck/screenshots and quits. ./gradlew :fabric:runDevCheck [-Pcompat=true]
loom {
    runs {
        devCheck {
            client()
            name "Fabric Dev Check"
            source sourceSets.gametest
            runDir "build/run/devCheck"
            property "cozychristmas.devcheck", "true"
        }
    }
}

// The same DevCheck against the release jar in a production-like client: real Fabric Loader with intermediary names and
// the dependencies' release jars, as players run it. DevCheck isn't in the release jar, so it comes as a second mod
// built from src/gametest plus the shared gametest package. ./gradlew :fabric:runProdDevCheck [-Pcompat=true];
// files in build/run/prodDevCheck
configurations {
    prodMods { transitive = false }
}
dependencies {
    prodMods "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    prodMods "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    prodMods "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    // the same groups as the dev runs' -Pcompat; here the loader unpacks nested jars itself, and mods built for
    // intermediary names (Moonlight's reload listeners) work as they do for players
    def prodCompat = project.findProperty("compat")?.toString()
    def prodWanted = { String group -> prodCompat != null && (prodCompat == "true" || prodCompat.split(",")*.trim().contains(group)) }
    if (prodWanted("jei")) {
        prodMods "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
        prodMods "net.mezzdev.config:mezz_config-${rootProject.minecraft_version}-fabric:${rootProject.mezz_config_version}"
    }
    if (prodWanted("jade")) {
        prodMods "maven.modrinth:jade:${rootProject.jade_fabric_version}"
    }
    if (prodWanted("snowy")) {
        prodMods "maven.modrinth:snowy-spirit:${rootProject.snowy_spirit_fabric_id}"
        prodMods "maven.modrinth:moonlight:${rootProject.moonlight_fabric_id}"
    }
}
def devCheckJar = tasks.register("devCheckJar", Jar) {
    from sourceSets.gametest.output
    from(project(":common").sourceSets.main.output) { include "dev/eliasnvx/cozychristmas/gametest/**" }
    archiveClassifier = "devcheck-dev"
}
def remapDevCheckJar = tasks.register("remapDevCheckJar", net.fabricmc.loom.task.RemapJarTask) {
    inputFile = devCheckJar.flatMap { it.archiveFile }
    archiveClassifier = "devcheck"
}
tasks.register("runProdDevCheck", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(remapJar, remapDevCheckJar, configurations.prodMods)
    jvmArgs.add("-Dcozychristmas.devcheck=true")
    runDir = layout.buildDirectory.dir("run/prodDevCheck")
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "architectury.common.json"
    exclude "dev/eliasnvx/cozychristmas/gametest/**" // shared GameTest bodies stay out of the released jar
    from rootProject.file("LICENSE")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-fabric"
}

// Every DevCheck starts in a fresh world: scenes left from an earlier run would stand in the shots
tasks.matching { it.name in ["runDevCheck", "runProdDevCheck"] }.configureEach {
    def saves = layout.buildDirectory.dir(name == "runDevCheck" ? "run/devCheck/saves/cozychristmas-check" : "run/prodDevCheck/saves/cozychristmas-check")
    doFirst { delete saves }
}
