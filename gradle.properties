org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=cozychristmas
mod_name=Cozy Christmas: Santa's Workshop, Krampus & Presents
mod_version=0.1.0
maven_group=dev.eliasnvx
archives_base_name=cozychristmas

platforms=fabric,forge

# Versions checked against maven-metadata / Modrinth on 2026-11-16 (1.20.1 branch). Same mod version on every branch.
minecraft_version=1.20.1
java_version=17
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1
forge_version=1.20.1-47.4.29
architectury_api_version=9.2.14
geckolib_version=4.8.4
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

# Soft dependencies (compat.*), compile only; checked 2026-11-16. JEI: maven.blamejared.com. REI, Cloth: maven.shedaniel.me.
# Jade, Curios, Serene Seasons, GlitchCore, Snowy Spirit, Moonlight: Modrinth maven (by version id where the version
# number is shared between loaders or a version has several files). The mods run in dev with -Pcompat=true (or some of them, see the loader builds).
jei_version=15.74.0.234
# JEI nests this library mod (mezz_config) in its jar, which a real install unpacks and the dev runtime doesn't
mezz_config_version=0.6.11
rei_version=12.1.785
cloth_config_version=11.1.136
basic_math_version=0.6.1
jade_fabric_version=11.13.3+fabric
jade_forge_version=11.13.3+forge
curios_forge_version=IPQlZkz1
serene_seasons_fabric_id=GICZwCsE
serene_seasons_forge_id=WMrhrybF
glitchcore_fabric_id=25HLOiOl
glitchcore_forge_id=pYPZ5MNI
snowy_spirit_fabric_id=i5YYwgT7
snowy_spirit_forge_id=qVcfvRob
moonlight_fabric_id=AHGZEddk
moonlight_forge_id=rF6052yd
# JEI's Fabric jars are built with a newer Loom than Architectury Loom: let the dev runtime (-Pcompat) load them
loom.ignoreDependencyLoomVersionValidation=true
