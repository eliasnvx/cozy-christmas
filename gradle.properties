org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=cozychristmas
mod_name=Cozy Christmas: Santa's Workshop, Krampus & Presents
mod_version=0.1.0
maven_group=dev.eliasnvx
archives_base_name=cozychristmas

platforms=fabric,neoforge

# Versions checked against maven-metadata / Modrinth on 2026-11-16 (1.21.1 branch). Same mod version on every branch.
minecraft_version=1.21.1
java_version=21
fabric_loader_version=0.19.5
fabric_api_version=0.116.17+1.21.1
neoforge_version=21.1.265
architectury_api_version=13.0.11
geckolib_version=4.9.3
jetbrains_annotations_version=26.1.0
junit_version=6.1.3

# Soft dependencies (compat.*), compile only; checked 2026-11-16. JEI: maven.blamejared.com. REI, Cloth: maven.shedaniel.me.
# Jade, Curios, Serene Seasons, GlitchCore, Snowy Spirit, Moonlight: Modrinth maven (by version id where the version
# number is shared between loaders). The mods run in dev with -Pcompat=true (or some of them, see the loader builds).
jei_version=19.70.0.469
# JEI nests this library mod (mezz_config) in its jar, which a real install unpacks and the dev runtime doesn't
mezz_config_version=0.6.6
rei_version=16.0.799
cloth_config_version=15.0.140
basic_math_version=0.6.1
jade_fabric_version=15.10.6+fabric
jade_neoforge_version=15.10.6+neoforge
curios_neoforge_version=9.5.1+1.21.1
serene_seasons_fabric_id=q34wStJM
serene_seasons_neoforge_id=pHEgQQUE
glitchcore_fabric_id=sux8kYHe
glitchcore_neoforge_id=S2TfWrZR
snowy_spirit_fabric_id=JKCG9jfo
snowy_spirit_neoforge_id=JHlWzPe0
moonlight_fabric_id=uANIaPO7
moonlight_neoforge_id=yBea1yLM
# JEI's 1.21.1 Fabric jars are built with Loom 1.18, Architectury Loom stops at 1.17: let the dev runtime (-Pcompat) load them
loom.ignoreDependencyLoomVersionValidation=true
